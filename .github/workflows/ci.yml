name: NeuralHive CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (no llama-cpp for CI speed)
        run: |
          pip install psutil requests numpy tqdm click rich huggingface-hub pytest pytest-cov

      - name: Run tests (skip llama-cpp dependent tests)
        run: |
          python -m pytest tests/ -v --ignore=tests/test_inference.py -x

      - name: Check imports
        run: |
          python -c "from core.runtime.layer_skipper import LayerSkipper"
          python -c "from core.runtime.quantizer import DynamicQuantizer"
          python -c "from core.storage.detector import StorageDetector"
          python -c "from core.models.selector import ModelSelector"
          python -c "from agent.loop import CodingAgent, CodeParser"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
